# Topic briefings (docs/DECISIONS.md, 35): standing questions on what councils across the UK keep returning to, each
# with its own page at /topics/<slug>, written afresh every week by `councils topics refresh` (the timer
# deploy/councils-topics.timer) through the same pipeline and checks as a reader's briefing.
#
# Wording matters. Each question asks what councils have discussed and decided, names no side and presumes no
# answer, and is one the minutes can answer. The topics were chosen across what councils do and from every side of
# each argument (decision 35 says why each is here); a new one needs the same care, and a line in that decision.
#
#   slug         the page's address: lower-case words joined by hyphens. Never change it once published: links
#                and search engines know the page by it
#   title        the page's heading, its entry on /topics and the home page, and its title in search results
#   question     what the model is asked each time the briefing is written, and what the page and its share card
#                show under the title. Keep the period in it ("over the past twelve months"), which `months` sets
#   description  one line under the title on /topics, and the start of the page's description
#   search       what the record is searched for, in the vocabulary of council minutes: the topic's reading of its
#                question, fixed here rather than read by the model each week, so every week's briefing searches
#                for the same thing (and the reading costs nothing)
#   months       how far back the record is searched, from the day it is written (default 12)
#   kinds        the meetings searched (default: full council, cabinet and their equivalents, and strategic
#                authorities' boards and scrutiny committees, as for a reader's question with no filters)
#
# Each briefing is a summary over up to 24 passages of minutes, balanced across councils run by different parties.
# One costs about 7 cents, so the ten a week cost about 70 cents (about 55p); docs/OPERATIONS.md, "Topic briefings".

[[topic]]
slug = "council-tax-and-budgets"
title = "Council tax and budgets"
question = "What have councils discussed and decided about council tax and their budgets over the past twelve months?"
description = "Budgets, council tax, savings, reserves and financial pressures."
search = "council tax, revenue budget, budget setting, savings, reserves, medium term financial strategy, budget gap"

