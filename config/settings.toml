# Where Councils Stand settings. Paths are relative to the repository root unless absolute.
# Environment overrides: COUNCILS_DATA_DIR, COUNCILS_CONFIG.

[paths]
data_dir = "data"

[archive]
# The record starts in May 2018 for every council (docs/DECISIONS.md, 4).
start_date = "2018-05-01"
# Briefings default to this many most recent years unless the question gives dates.
default_years = 4

[modgov]
# Identifies the crawler to councils' servers, with a page explaining what it does.
user_agent = "Mozilla/5.0 (compatible; WhereCouncilsStand/0.1; +https://github.com/rj-mitchell/wherecouncilsstand)"
# At least this many seconds between requests to the same council.
min_interval_seconds = 1.0
timeout_seconds = 40
retries = 3
# Stop loading a council after this many meetings in a row time out: its service isn't answering in time, and
# nothing is stored, so the next load or update tries again (sources/streak.py). 0 never stops.
timeouts_in_a_row = 2
# Minutes of a meeting newer than this are fetched again: they are approved, and sometimes corrected, at the
# next meeting.
refetch_days = 120
# Read minutes published only as a document (sources/documents.py).
read_documents = true

[ranking]
candidates_bm25 = 300
candidates_vector = 300
vector_refine_factor = 5
# Weight of normalised BM25 vs cosine similarity in the relevance score.
bm25_weight = 0.5
# Recency factor = floor + (1 - floor) * 0.5 ** (age_years / half_life); half_life = min_half_life_years / slider.
recency_floor = 0.35
min_half_life_years = 3.0
default_recency = 0.4
# Evidence selection for briefings: balance across councils and the groups chosen (rank/evidence.py).
max_per_council = 2
max_per_meeting = 1
min_relevance_ratio = 0.25

[answer]
# As Where They Stand and Where Countries Stand: Sonnet writes briefings, Haiku reads the question.
model = "claude-sonnet-5-5"
query_parse_model = "claude-haiku-5-5"
summary_sources = 24
comprehensive_sources = 40
summary_effort = "medium"
comprehensive_effort = "high"
query_parse_effort = "low"
max_tokens = 16000
use_fallbacks = true

[embedding]
# "fastembed" (local ONNX model; weights fetched once from Hugging Face and pinned)
# or "hashing" (deterministic, offline; for tests only).
backend = "fastembed"
model = "snowflake/snowflake-arctic-embed-xs"
dim = 384
passage_words = 250
batch_size = 8

[usage]
# The site is public; each new model-written briefing costs money. As Where They Stand.
per_visitor_daily_questions = 30   # a backstop against automated use (visitors keyed by a salted hash of their IP)
requests_per_minute = 20           # questions and searches per visitor
answer_cache_hours = 168           # an identical question is answered from the cache until the data changes, or a week
daily_spend_cap_usd = 3.0          # over this, briefings stop for the day and the sources are shown instead
monthly_spend_cap_usd = 50.0
# A briefing's cost is known only when it finishes, so each one being written is counted against the caps at this
# estimate meanwhile; and only so many are written at once, per visitor and in all (as Where MPs Stand).
briefing_estimate_usd = 0.15
briefings_at_once_per_visitor = 2
briefings_at_once = 8
# USD per million tokens, for spend tracking only.
price_input_per_mtok = 2.0
price_output_per_mtok = 10.0
price_cache_read_per_mtok = 0.2
cache_write_multiplier = 1.25

[usage.models."claude-haiku-5-5"]
price_input_per_mtok = 0.1
price_output_per_mtok = 0.5
price_cache_read_per_mtok = 0.01

[site]
name = "Where Councils Stand"
url = "https://wherecouncilsstand.com"
# the donation page, once the charity is registered; nothing is shown while it is empty
donate_url = ""
