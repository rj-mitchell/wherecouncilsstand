[project]
name = "councils"
version = "0.1.0"
description = "Where Councils Stand: sourced briefings on what councils across the UK have said and decided."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "duckdb>=1.1",
    "fastapi>=0.162.2",
    "httpx>=0.27",
    "lancedb>=0.17",
    "lxml>=5.3",
    "numpy>=1.26",
    "pdfminer-six>=20240706",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "typer>=0.29.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Local open-source embedding models (ONNX runtime). Weights are downloaded once
# from Hugging Face at setup and pinned; no council data goes to Hugging Face.
embed = ["fastembed>=0.4"]

[project.scripts]
councils = "councils.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/councils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
