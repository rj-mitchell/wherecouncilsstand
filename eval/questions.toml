category = "nation"
expect = { date_from = "default", nations = ["northern_ireland"] }

[[q]]
id = "england-devolution"
question = "What have English councils said about local government reorganisation and devolution?"
category = "nation"
expect = { date_from = "default", nations = ["england"] }

# ---- parties: who runs the council, and what councillors did -----------------------------------------------------

[[q]]
id = "reform-budgets"
question = "How have Reform UK councillors voted on council budgets?"
category = "party"
expect = { date_from = "default", parties = ["REF"], wants_votes = true }

[[q]]
id = "labour-run-housing"
question = "What have Labour-run councils decided about council housing?"
category = "party"
expect = { date_from = "default", control = ["LAB"] }

[[q]]
id = "reform-run-dei"
question = "What have Reform-run councils decided about diversity and inclusion jobs?"
category = "party"
expect = { date_from = "default", control = ["REF"] }

[[q]]
id = "noc-budgets"
question = "How have councils under no overall control set their budgets?"
category = "party"
expect = { date_from = "default", control = ["NOC"] }

[[q]]
id = "tory-councils"
question = "What have Tory councils done about council tax rises?"
category = "party"
expect = { date_from = "default", control = ["CON"] }

[[q]]
id = "green-councillors-cycling"
question = "What have Green councillors said about cycle lanes?"
category = "party"
expect = { date_from = "default", parties = ["GRN"] }

[[q]]
id = "ld-vs-con"
question = "How do Liberal Democrat and Conservative councils differ on the local plan and housebuilding?"
category = "party"
# comparing councils run by different parties is a grouping, not a filter; either reading is acceptable
expect = { date_from = "default", control_any = [[], ["CON", "LD"]] }

