[[q]]
id = "planning-application"
question = "What did the planning committee decide about the application for 40 homes on Mill Lane?"
category = "outside"
expect = { date_from = "default" }
# planning committees aren't read (only full council and cabinet): a briefing should find nothing to say, but the
# search may still find passages that mention planning, so the evidence isn't checked
