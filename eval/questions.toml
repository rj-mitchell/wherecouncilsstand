# The briefing test set (roadmap X8; needed before the beta): realistic questions with the filters a careful reader
# would choose, and what the evidence must contain. A starter set, to grow as real questions come in.
#
# Used by `councils evaluate`, which scores, without writing any briefing:
# (1) how each question is read: each filter compared with `expect`;
# (2) the evidence found: whether it is empty when it should be ("No records found" is the right answer to
#     `no_records` questions), and whether it includes the councils in `include` (GSS codes; at least one source from
#     each). Evidence checks only mean something on the full record (the server's data), not on a test record.
#
# Filters not listed under `expect` are expected to be empty. Dates are compared by year: "default" means the site's
# default range (the last 4 years) because the question gives no dates; `date_from` alone leaves the end open.
# `<field>_any` lists acceptable alternatives. Codes: `control` and `parties` use the party codes (LAB, CON, LD, GRN,
# REF, PC, SNP, DUP, SF, SDLP, UUP, APNI, IND, NOC); `nations` england, wales, scotland, northern_ireland;
# `council_types` county, district, unitary, metropolitan, london_borough; `kinds` council (full council), cabinet,
# policy. The questions are read as if today were 6 November 2026.

today = "2026-11-06"

# ---- topics, no filters --------------------------------------------------------------------------------------------

[[q]]
id = "bins-weekly"
question = "What have councils decided about weekly bin collections?"
category = "topic"
expect = { date_from = "default" }

[[q]]
id = "toilets"
question = "What have councils said about closing public toilets?"
category = "topic"
expect = { date_from = "default" }

[[q]]
id = "libraries"
question = "What have councils decided about closing or handing over libraries?"
category = "topic"
expect = { date_from = "default" }

[[q]]
id = "send-transport"
question = "How have councils dealt with rising costs of school transport for children with special educational needs?"
category = "topic"
expect = { date_from = "default" }

[[q]]
id = "section-114"
question = "What have councils said about the risk of issuing a section 114 notice?"
category = "topic"
expect = { date_from = "default" }

[[q]]
id = "potholes"
question = "What have councils decided about spending on potholes and road repairs?"
category = "topic"
expect = { date_from = "default" }

# ---- dates ---------------------------------------------------------------------------------------------------------

[[q]]
id = "climate-emergency"
question = "How did councillors vote on declaring a climate emergency in 2019?"
category = "dates"
expect = { date_from = "2019", date_to = "2019", wants_votes = true }

[[q]]
id = "bins-since-2023"
question = "What have councils decided about weekly bin collections since 2023?"
category = "dates"
expect = { date_from = "2023" }

[[q]]
id = "covid-meetings"
question = "What did councils decide about holding meetings remotely between 2020 and 2021?"
category = "dates"
expect = { date_from = "2020", date_to = "2021" }

[[q]]
id = "last-two-years"
question = "What have councils said about asylum hotels in the last two years?"
category = "dates"
expect = { date_from = "2024" }

[[q]]
id = "before-records"
question = "What did councils decide about bin collections in 2012?"
category = "dates"
expect = { date_from = "2012", date_to = "2012" }
no_records = true

# ---- nations -------------------------------------------------------------------------------------------------------

[[q]]
id = "wales-second-homes"
question = "What have councils in Wales decided about second homes and council tax?"
category = "nation"
expect = { date_from = "default", nations = ["wales"] }

[[q]]
id = "scotland-visitor-levy"
question = "What have Scottish councils said about a visitor levy?"
category = "nation"
expect = { date_from = "default", nations = ["scotland"] }

[[q]]
id = "ni-irish-language"
